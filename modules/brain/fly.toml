# AlphaPro Intelligence Oracle - Fly.io Blueprint

app = "alphapro-brain"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 5000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "5s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/status"

[env]
  PORT = "5000"
  PYTHON_VERSION = "3.11"
