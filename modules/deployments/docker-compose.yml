version: '3.8'

networks:
  alphapro-net:
    driver: bridge

services:
  # --------------------------------------------------
  # INFRASTRUCTURE SERVICES (PostgreSQL, Redis)
  # --------------------------------------------------
  postgres:
    image: postgres:15-alpine
    container_name: alphapro_postgres
    environment:
      POSTGRES_USER: alphapro
      POSTGRES_PASSWORD: password
      POSTGRES_DB: alphapro
    ports:
      - "5432:5432"
    volumes:
      - alphapro-db-data:/var/lib/postgresql/data
    networks:
      - alphapro-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alphapro -d alphapro"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: alphapro_redis
    ports:
      - "6379:6379"
    networks:
      - alphapro-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # 1. AI Optimization Engine (Python)
  brain:
    build:
      context: ../..
      dockerfile: modules/brain/Dockerfile
    container_name: alphapro_brain
    ports:
      - "5000:5000" # Port aligned with README
    environment:
      - PYTHONUNBUFFERED=1
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:5000')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - alphapro-net

  # 2. API Gateway & Frontend (Node.js)
  api:
    build:
      context: ../..
      dockerfile: modules/api/Dockerfile
    container_name: alphapro_api
    ports:
      - "3000:3000" # Port aligned with prove-profit.js and README
    env_file:
      - ../../.env
    environment:
      - NODE_ENV=production
      - PORT=3000
      - TRADING_MODE=LIVE
      - BRAIN_URL=http://brain:5000
      # Connect to infrastructure services
      - DATABASE_URL=postgresql://alphapro:password@postgres:5432/alphapro
      - REDIS_URL=redis://redis:6379
    depends_on:
      brain:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - alphapro-net
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # 3. Dashboard (React + Nginx)
  dashboard:
    build:
      context: ../..
      dockerfile: modules/dashboard/Dockerfile
    container_name: alphapro_dashboard
    ports:
      - "80:80" # Port aligned with README
    depends_on:
      - api
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:80/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - alphapro-net

volumes:
  alphapro-db-data:
