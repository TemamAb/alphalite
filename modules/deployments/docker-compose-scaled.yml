# AlphaPro Production Docker Compose with Horizontal Scaling
# Supports multiple API instances for high availability and performance
# SECURED: Added read_only, tmpfs, cap_drop, security_opt, health checks, and logging

services:
  # 1. Load Balancer (nginx)
  loadbalancer:
    image: nginx:alpine
    ports:
      - "3001:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api1
      - api2
    networks:
      - alphapro-net
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # 2. AI Optimization Engine (Python) - Single instance
  brain:
    build:
      context: ../brain
      dockerfile: Dockerfile
    environment:
      - PYTHONUNBUFFERED=1
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    networks:
      - alphapro-net
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:5000')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # 3. API Instance 1 (Node.js) - Can scale to more
  api1:
    build:
      context: ../api
      dockerfile: Dockerfile
    environment:
      - NODE_ENV=production
      - PORT=3000
      - TRADING_MODE=LIVE
      - BRAIN_URL=http://brain:5000
      - INSTANCE_ID=1
    env_file:
      - .env
    depends_on:
      - brain
    networks:
      - alphapro-net
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # 4. API Instance 2 (Node.js) - For horizontal scaling
  api2:
    build:
      context: ../api
      dockerfile: Dockerfile
    environment:
      - NODE_ENV=production
      - PORT=3000
      - TRADING_MODE=LIVE
      - BRAIN_URL=http://brain:5000
      - INSTANCE_ID=2
    env_file:
      - .env
    depends_on:
      - brain
    networks:
      - alphapro-net
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  alphapro-net:
    driver: bridge
