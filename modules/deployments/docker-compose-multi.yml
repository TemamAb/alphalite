# AlphaPro Production Deployment
# 4 Containers: 2 API + 1 Brain + 1 Dashboard
# SECURED: Full security hardening applied

services:
  # ============================================================
  # Load Balancer (Nginx) - NEW
  # ============================================================
  loadbalancer:
    image: nginx:alpine
    container_name: alphapro-loadbalancer
    ports:
      - "3001:80" # Changed to 3001 to avoid conflict with other compose files
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro # Mount the new config
    restart: unless-stopped
    depends_on:
      - api-1
      - api-2
    networks:
      - alphapro-net
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
  # ============================================================
  # Dashboard (React + Nginx)
  # ============================================================
  dashboard:
    build:
      context: ../..
      dockerfile: modules/dashboard/Dockerfile
    container_name: alphapro-dashboard
    ports:
      - "8080:80"
    restart: unless-stopped
    networks:
      - alphapro-net
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:80/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ============================================================
  # Brain (AI Optimization Engine)
  # ============================================================
  brain:
    build:
      context: ../..
      dockerfile: modules/brain/Dockerfile
    container_name: alphapro-brain
    ports:
      - "5001:5000"
    environment:
      - PORT=5000
      - BRAIN_PORT=5000
    restart: unless-stopped
    networks:
      - alphapro-net
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:5000/status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ============================================================
  # API Instance 1 (Primary)
  # ============================================================
  api-1:
    build:
      context: ../..
      dockerfile: modules/api/Dockerfile
    container_name: alphapro-api-1
    environment:
      - NODE_ENV=production
      - PORT=3000
      - TRADING_MODE=LIVE
      - INSTANCE_ID=alphapro-1
      - BRAIN_URL=http://brain:5000
    env_file:
      - ../../.env
    depends_on:
      brain:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - alphapro-net
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ============================================================
  # API Instance 2 (Secondary)
  # ============================================================
  api-2:
    build:
      context: ../..
      dockerfile: modules/api/Dockerfile
    container_name: alphapro-api-2
    environment:
      - NODE_ENV=production
      - PORT=3000
      - TRADING_MODE=LIVE
      - INSTANCE_ID=alphapro-2
      - BRAIN_URL=http://brain:5000
    env_file:
      - ../../.env
    depends_on:
      brain:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - alphapro-net
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ============================================================
  # PostgreSQL Database (Copied from root docker-compose.yml)
  # ============================================================
  postgres:
    image: postgres:15-alpine
    container_name: alphapro_postgres_multi
    restart: unless-stopped
    environment:
      - POSTGRES_USER=alphapro
      - POSTGRES_PASSWORD=alphapro_secure_pwd
      - POSTGRES_DB=alphapro
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - alphapro-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alphapro -d alphapro"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================
  # Redis Cache (Copied from root docker-compose.yml)
  # ============================================================
  redis:
    image: redis:7-alpine
    container_name: alphapro_redis_multi
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - alphapro-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  alphapro-net:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
