# AlphaPro Production Deployment Blueprint for Render.com
# This file defines all services, databases, and environment variables.
# Secrets (like PRIVATE_KEY) must be set in the Render Dashboard.

services:
  # 1. API Service (Node.js Backend)
  - type: web
    name: alphapro-api
    env: docker
    dockerfilePath: ./modules/api/Dockerfile
    dockerContext: . # Build from the root of the repo
    healthCheckPath: /api/health
    plan: standard # Choose a plan with enough memory
    numInstances: 1 # Can be scaled up in the Render dashboard
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000 # Render will use this internally
      - key: TRADING_MODE
        value: LIVE
      # --- Connections to other services ---
      - key: DATABASE_URL
        fromDatabase:
          name: alphapro-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: alphapro-redis
          property: connectionString
      - key: BRAIN_URL
        fromService:
          type: web
          name: alphapro-brain
          property: url
      # --- Secrets (Set these in Render Dashboard) ---
      # Add ALL other required secrets (PIMLICO_API_KEY, RPC URLs, etc.)
      # in the Render UI. This file just shows the pattern.
      - key: PRIVATE_KEY
        sync: false
      - key: WALLET_ADDRESS
        sync: false
      - key: PIMLICO_API_KEY
        sync: false
      - key: ETH_RPC_URL
        sync: false

  # 2. Brain Service (Python AI)
  - type: web # This was a separate item, now it's part of the service definition
    name: alphapro-brain
    env: docker
    dockerfilePath: ./modules/brain/Dockerfile
    dockerContext: .
    healthCheckPath: /status
    plan: starter
    envVars:
      - key: PORT
        value: 5000
      - key: PYTHON_VERSION
        value: "3.11"
      - key: ETH_RPC_URL
        fromService:
          type: web
          name: alphapro-api # Get it from the API's env group
          envVarKey: ETH_RPC_URL

  # 3. Dashboard Service (React Frontend)
  - type: static # This was a separate item, now it's part of the service definition
    name: alphapro-dashboard
    rootDir: modules/dashboard # Tell Render where the dashboard code is
    buildCommand: echo "Static site, no build needed."
    staticPublishPath: dist
    plan: starter
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: alphapro-api
          property: url # Dynamically get the API's public URL

# --- Managed Backend Services ---

databases:
  - name: alphapro-db # PostgreSQL Database
    plan: starter # Free tier
    databaseName: alphapro
    user: alphapro

# Redis is also a service, but of a specific type
  - type: redis
    name: alphapro-redis
    plan: starter
    ipAllowList: [] # Allow only internal connections from other Render services
