# AlphaPro Unified Production Blueprint for Render.com
# 100% Production Ready Deployment Configuration

services:
  # 1. Main Unified Service (Trading Engine + API + Dashboard)
  - type: web
    name: alphapro-enterprise
    env: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    plan: standard # High-performance plan for HFT engine
    numInstances: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: TRADING_MODE
        value: LIVE
      - key: AUTO_START_ENGINE
        value: "true"
      
      # --- Infrastructure Connections ---
      - key: DATABASE_URL
        fromDatabase:
          name: alphapro-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: alphapro-redis
          property: connectionString
      - key: BRAIN_API_URL
        fromService:
          type: web
          name: alphapro-brain
          property: url

      # --- Essential Secrets (To be set in Render Dashboard) ---
      # Primary Keys
      - key: PRIVATE_KEY
        sync: false
      - key: WALLET_ADDRESS
        sync: false
      - key: PIMLICO_API_KEY
        sync: false
      - key: ALCHEMY_API_KEY
        sync: false
      
      # RPC Matrix (Optional: Defaults provided in configService)
      - key: ETH_RPC_URL
        sync: false
      - key: POLYGON_RPC_URL
        sync: false
      - key: ARBITRUM_RPC_URL
        sync: false
      - key: OPTIMISM_RPC_URL
        sync: false
      - key: BASE_RPC_URL
        sync: false

      # Authentication
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        value: iamtemam@gmail.com
      - key: ADMIN_PASSWORD_HASH
        value: "$2b$12$EHjRMYpfJVsqFmZ.avN80OUZsLm7UoQY3S6euIZxrd3bkTWA6eR16"

  # 2. Intelligence Oracle (Python AI)
  - type: web
    name: alphapro-brain
    env: docker
    dockerfilePath: ./modules/brain/Dockerfile
    dockerContext: .
    healthCheckPath: /status
    plan: starter
    envVars:
      - key: PORT
        value: 5000
      - key: PYTHON_VERSION
        value: "3.11"

  # 3. Distributed Cache (Redis)
  - type: redis
    name: alphapro-redis
    plan: starter
    ipAllowList: [] # Internal only

# --- Managed Persistence Layer ---
databases:
  - name: alphapro-db
    plan: starter
    databaseName: alphapro
    user: alphapro

