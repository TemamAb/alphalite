<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AlphaPro Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>AI Optimization & Performance</h1>
            <button id="evolve-btn">Evolve Now</button>
        </div>
        <div class="grid-container">
            <div class="main-content">
                <div class="panel" id="latency-panel">
                    <h2>HFT Latency Breakdown</h2>
                    <div id="latency-metrics" class="panel-content">Loading...</div>
                </div>
                <div class="panel" id="benchmark-panel">
                    <h2>Competitive Benchmark</h2>
                    <div id="competitor-benchmark" class="panel-content">Loading...</div>
                </div>
            </div>
            <div class="sidebar">
                <div class="panel" id="ai-engine-panel">
                    <h2>AI Evolution Engine</h2>
                    <div id="ai-state" class="panel-content">Loading...</div>
                </div>
                <div class="panel" id="history-panel">
                    <h2>Recent Generations</h2>
                    <div id="generation-history" class="panel-content">Loading...</div>
                </div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
