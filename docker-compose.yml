# AlphaPro Unified Docker Compose for Local Production
version: '3.8'

services:
  # The main application service (API + Engine + Frontend)
  alphapro-engine:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: alphapro-engine
    restart: unless-stopped
    ports:
      - "3000:3000" # Main app access
    env_file:
      - .env # Load environment variables from .env file
    environment:
      - NODE_ENV=production
      - TRADING_MODE=LIVE
      - DATABASE_URL=postgres://alphapro:password@postgres:5432/alphapro
      - REDIS_URL=redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # Correct healthcheck endpoint from DOCKER_BLOCKERS_REPORT
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - alphapro-net

  # PostgreSQL Database Service
  postgres:
    image: postgres:15-alpine
    container_name: alphapro-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=alphapro
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=alphapro
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alphapro -d alphapro"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - alphapro-net

  # Redis Cache Service
  redis:
    image: redis:7-alpine
    container_name: alphapro-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - alphapro-net

networks:
  alphapro-net:
    driver: bridge

volumes:
  postgres_data: