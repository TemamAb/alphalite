# AlphaPro Sovereign Enterprise - Fly.io Blueprint
# Optimized for HFT Performance and Unified Execution

app = "alphapro-enterprise"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/api/health"

[env]
  NODE_ENV = "production"
  PORT = "3000"
  TRADING_MODE = "LIVE"
  AUTO_START_ENGINE = "true"
  BRAIN_API_URL = "http://alphapro-brain.internal:5000"

[[vm]]
  cpu_kind = "shared"
  cpus = 2
  memory = "2gb" # Bumping memory for HFT engine performance

